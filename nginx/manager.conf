# Single public entry. All routing and authorization are handled by the manager.
# Gunicorn and Trackio backends listen only on loopback interfaces.
map $request_method $trackio_login_key {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $trackio_login_key zone=trackio_login:10m rate=5r/m;

server {
    listen 9000;
    server_name _;
    client_max_body_size 100m;

    location = /login {
        limit_req zone=trackio_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:9001;
        proxy_set_header Host $http_host;
    }

    location = /_trackio/auth { return 404; }

    location / {
        proxy_pass http://127.0.0.1:9001;
        proxy_set_header Host $http_host;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
